name: Build Android ADB (4 ABIs)

on:
  workflow_dispatch: # 支持手动点击运行
    inputs:
      api_level:
        description: 'Android API level of the produced adb binary'
        required: false
        default: '30'

permissions:
  contents: read

env:
  # android-sdk-tools 已完整内置在本仓库，不再引用上游仓库 / submodule
  SDK_TOOLS_DIR: platform-tools
  # platform-tools 36.0.0 对应 Android 16.0.0_r1 的 AOSP 源码。
  # 注意：AOSP 各仓库没有 platform-tools-36.0.0 这个 tag，只能按 Android 版本 tag 取源码
  AOSP_TAG: android-16.0.0_r1
  # 36.0.0 使用 C++23 的 std::string::resize_and_overwrite 等特性，需要 r29 的 libc++
  NDK_VERSION: r29
  # 36.0.0 的 libbase 使用 fdsan（API 29 起才有），低于 30 会编译失败
  API_LEVEL: ${{ inputs.api_level || '30' }}
  # CMake 4.x 会拒绝 cmake_minimum_required(<3.5) 的第三方项目
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build-adb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space
        # AOSP 源码 + 4 个架构的 build tree 比较大，先清理 runner 上的无用工具
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake bison flex patch

      # get_source.py 会检查 go / bison / flex，boringssl 配置阶段也需要 go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Android NDK (direct download)
        run: |
          # 不用 android-actions/setup-android（其 NDK 目录布局不可控，会导致
          # build/cmake/android.toolchain.cmake 缺失），直接下载官方 NDK zip
          curl -L --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          NDK_DIR="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          test -f "$NDK_DIR/build/cmake/android.toolchain.cmake" && echo "NDK toolchain OK"

      - name: Fetch AOSP Sources
        working-directory: ${{ env.SDK_TOOLS_DIR }}
        run: |
          # 版本号由 patches/misc/platform_tools_version.h 决定（当前 36.0.0），
          # 源码 tag 用 AOSP_TAG（Android 16.0.0_r1）而不是 platform-tools-36.0.0
          python3 get_source.py --tags "$AOSP_TAG" --jobs "$(nproc)"
          # 源码不再需要 git 历史，删掉 .git 减小磁盘占用
          find src -name .git -prune -exec rm -rf {} +

      - name: Build Host Protoc
        # adb / aapt2 的 .proto 需要 host 版 protoc，只构建一次供 4 个架构复用
        working-directory: ${{ env.SDK_TOOLS_DIR }}
        run: python3 build.py --protoc-only --protoc-output host-tools/protoc

      - name: Build ADB (4 ABIs)
        working-directory: ${{ env.SDK_TOOLS_DIR }}
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            case "$ABI" in
              arm64-v8a)   ARCH=aarch64 ;;
              armeabi-v7a) ARCH=arm ;;
              x86)         ARCH=i686 ;;
              x86_64)      ARCH=x86_64 ;;
            esac
            echo "==================== building $ABI ($ARCH) ===================="
            python3 build.py \
              --toolchain ndk \
              --arch "$ARCH" \
              --link shared \
              --api "$API_LEVEL" \
              --protoc host-tools/protoc \
              --build "build/$ARCH" \
              --target adb

            # 每构建完一个架构就取走产物并清理 build tree，避免 4 份中间文件撑爆磁盘
            mkdir -p "$GITHUB_WORKSPACE/dist/$ABI"
            cp "build/$ARCH/bin/platform-tools/adb" "$GITHUB_WORKSPACE/dist/$ABI/libadb.so"
            rm -rf "build/$ARCH"
          done

      - name: Verify Artifacts
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "dist/$ABI/libadb.so"
            file "dist/$ABI/libadb.so"
          done

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: libadb-android-4abi
          path: dist/
          retention-days: 7
